<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1f1f1f, #2c2c2c);
      color: white;
      min-height: 100vh;
      padding: 0;
    }

    header {
      background: rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .brand {
      font-family: 'Cursive';
      font-size: 2rem;
      color: white;
      text-shadow: 0 0 5px #fff, 0 0 10px #aaf, 0 0 20px #66f;
    }

    nav a {
      margin-left: 1.5rem;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #88f;
    }

    .content {
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .glass {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 2rem;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: all 0.3s ease;
    }

    h1, h2 {
      font-weight: 700;
      margin-top: 0;
      color: #e0e0ff;
    }

    p {
      line-height: 1.7;
      font-size: 1.1rem;
      color: #ddd;
      margin-bottom: 1.2rem;
    }

    code {
      background: rgba(255, 255, 255, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .download-list {
      list-style: none;
      padding: 0;
    }

    .download-list li {
      margin-bottom: 1rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 12px;
      transition: transform 0.2s ease;
    }

    .download-list li:hover {
      transform: scale(1.02);
    }

    .download-list a {
      color: #aaf;
      font-weight: 600;
      text-decoration: none;
    }

    .download-list a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .content {
        padding: 1rem;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        margin-top: 0.5rem;
      }

      nav a {
        display: inline-block;
        margin-left: 0;
        margin-right: 1rem;
        font-size: 1rem;
      }

      .glass {
        padding: 1.5rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>

<body>
  <header>
    <div class="brand">VIYAS</div>
    <nav>

      <a href="#" onclick="showDownloads()">Downloads</a>
    </nav>
  </header>

<div class="content" id="main">
    <!-- Dynamic content goes here -->
  </div>

  <script>
    function showHome() {
      document.getElementById('main').innerHTML = `
        <div class="glass">
          <h1>Welcome to VIYAS</h1>
          <p><strong>VIYAS</strong> is a lightweight, open-source web utility designed to automatically detect and list all <code>.zip</code> files located in the <code>/download/</code> directory. With a refined macOS-like UI, VIYAS offers a modern, minimal, and elegant way to present downloadable assets.</p>

          <p>Simply drop any zip files into the server's <code>/download/</code> folder, and they’ll be available for direct download — no database or backend logic needed. Perfect for creators, developers, and hobbyists looking to share files quickly and stylishly.</p>

          <p>Built with simplicity and extensibility in mind, VIYAS is <strong>fully open-source</strong>. You’re welcome to fork, modify, and integrate it into your own projects with ease.</p>

          <p>✨ Seamless, glassy, and made for the web — VIYAS redefines what a download page can look like.</p>
        </div>
      `;
    }

    async function showDownloads() {
      const res = await fetch('/download/');
      const text = await res.text();
      const zipRegex = /href\s*=\s*["']([^"']+\.zip)["']/gi;
      const matches = [...text.matchAll(zipRegex)];
      const files = matches.map(match => match[1]);
      let listItems = files.map(file => {
        const displayName = decodeURIComponent(file.split('/').pop());
        return `<li><a href="/download/${file}" download>${displayName}</a></li>`;
      }).join('');


      document.getElementById('main').innerHTML = `
        <div class="glass">
          <h2>Available Downloads</h2>
          <ul class="download-list">
            ${listItems || '<li>No .zip files found.</li>'}
          </ul>
        </div>
      `;
    }

    // Load Home by default
    showHome();
  </script>
